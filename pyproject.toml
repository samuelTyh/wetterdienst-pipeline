[project]
name = "weather-pipeline"
version = "0.1.0"
description = "Weather data ingestion and transformation pipeline for Enpal Energy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.8.9",
    "httpx>=0.28.1",
    "pandas>=2.2.3",
    "geopandas>=1.0.1",
    "shapely>=2.0.6",
    "prefect>=3.1.11",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.6.1",
    "pytz>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
